<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Your atlas has moved</title
  ><style>
    body {
      font: 18px/1.6 system-ui;
      max-width: 620px;
      margin: 12vh auto;
      padding: 24px;
      background: #f5f2e9;
      color: #223d34;
    }
    a {
      color: #234c41;
    }
    h1 {
      font: 48px Georgia;
    }
  </style>
  <h1>A new chapter.</h1>
  <p>
    The learning atlas has been rebuilt. The rebuilt astronomy collection
    includes planet scales, moon worlds and the changing sky. Your previous
    browser records have not been deleted.
  </p>
  <p><a href="../#/area/moons">Explore Moons & Planets →</a></p>
  <p><a href="../#/about">Your preserved history and backups →</a></p>
  <script>
    if ("serviceWorker" in navigator)
      navigator.serviceWorker
        .getRegistration("./")
        .then((r) => r?.update())
        .catch(() => {});
  </script>
</html>
